<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#071b17">
<title>CURVE — Free Kick</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&display=swap');
:root{color-scheme:dark;--mint:#b8ff65;--ink:#071b17;--panel:rgba(9,28,25,.72)}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:Manrope,system-ui,sans-serif;color:#f4f6ed}body{touch-action:none}#game{position:fixed;inset:0;width:100%;height:100%;display:block}.shade{position:fixed;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(3,14,13,.44),transparent 29%,transparent 65%,rgba(3,14,13,.45))}.ui{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;padding:clamp(16px,4vw,36px);pointer-events:none}.top{display:flex;align-items:flex-start;justify-content:space-between}.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.18em;font-size:13px}.brandmark{width:30px;height:30px;border-radius:10px;background:var(--mint);color:#11251b;display:grid;place-items:center;font-size:17px;letter-spacing:0;box-shadow:0 3px 20px #b8ff6533}.round{font:500 10px 'DM Mono',monospace;letter-spacing:.16em;color:#d4dfd1a8;margin-top:3px}.scorebox{display:flex;gap:8px}.stat{min-width:76px;text-align:right;padding:10px 13px;border:1px solid #ffffff20;background:var(--panel);border-radius:14px;backdrop-filter:blur(14px)}.stat small{display:block;color:#a8b7ad;font:10px 'DM Mono',monospace;letter-spacing:.12em}.stat b{font-size:19px;line-height:1.3}.stat b em{color:var(--mint);font-style:normal}.bottom{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.instructions{max-width:290px}.eyebrow{font:500 10px 'DM Mono',monospace;letter-spacing:.2em;color:var(--mint);text-transform:uppercase;margin-bottom:8px}.title{font-weight:800;font-size:clamp(21px,5vw,32px);line-height:1.08;letter-spacing:-.04em;margin:0 0 7px}.sub{color:#d7e1d6b5;font-size:12px;line-height:1.5}.swipe-icon{display:inline-block;color:var(--mint);font-size:15px;margin-right:5px}.kick{pointer-events:none;border:1px solid #b8ff6566;background:#b8ff651a;color:var(--mint);border-radius:99px;padding:12px 16px;font:500 10px 'DM Mono',monospace;letter-spacing:.13em;white-space:nowrap;transition:.2s}.kick.hidden{opacity:0;transform:translateY(6px)}.bottom-actions{position:fixed;right:clamp(16px,4vw,36px);bottom:clamp(92px,14vh,130px);pointer-events:auto}.reset{background:#071b17aa;border:1px solid #ffffff29;color:#dbe4d7;border-radius:12px;padding:9px 13px;font:10px 'DM Mono',monospace;letter-spacing:.1em;cursor:pointer;backdrop-filter:blur(10px)}.toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.94);opacity:0;transition:.35s;pointer-events:none;text-align:center;text-shadow:0 4px 20px #00130e}.toast.show{opacity:1;transform:translate(-50%,-50%) scale(1)}.toast strong{display:block;font-size:clamp(36px,10vw,62px);letter-spacing:-.06em;line-height:1}.toast span{display:inline-block;margin-top:10px;padding:7px 12px;border:1px solid #ffffff30;border-radius:30px;background:#071b17b8;font:10px 'DM Mono',monospace;letter-spacing:.2em;color:var(--mint)}.hint{color:#c3d1c9}.toast.goal strong{color:var(--mint)}.toast.saved strong{color:#fff}.progress{position:fixed;left:50%;bottom:clamp(20px,4vh,36px);transform:translateX(-50%);width:110px;height:3px;border-radius:3px;background:#ffffff20;overflow:hidden}.progress i{display:block;height:100%;width:0;background:var(--mint);transition:width .6s}.sound{position:fixed;top:clamp(75px,11vh,110px);right:clamp(16px,4vw,36px);font:10px 'DM Mono',monospace;color:#d4dfd1a8;letter-spacing:.12em}
@media (max-height:650px){.ui{padding:14px 20px}.bottom-actions{bottom:83px}.title{font-size:22px}.sub{font-size:11px}.progress{bottom:13px}.sound{top:60px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Free kick football game. Swipe the ball toward the goal to shoot."></canvas><div class="shade"></div>
<div class="ui"><header class="top"><div><div class="brand"><span class="brandmark">↗</span>CURVE</div><div class="round">FREE KICK CLUB&nbsp; / &nbsp;01</div></div><div class="scorebox"><div class="stat"><small>GOALS</small><b><em id="goals">0</em><span style="color:#718078"> / </span><span id="shots">0</span></b></div><div class="stat"><small>BEST</small><b><em id="best">0</em></b></div></div></header>
<div class="sound">STADIUM · PRACTICE</div>
<footer class="bottom"><div class="instructions"><div class="eyebrow" id="eyebrow">Your moment</div><h1 class="title" id="title">Bend it like<br>you mean it.</h1><div class="sub" id="sub"><span class="swipe-icon">↗</span>Swipe the ball. Faster swipe = more power.<br>Draw a curve to add curl.</div></div><div class="kick" id="kick">↗ &nbsp; SWIPE TO SHOOT</div></footer></div>
<div class="bottom-actions"><button class="reset" id="reset">↻ &nbsp; RESET</button></div><div class="toast" id="toast"><strong></strong><span></span></div><div class="progress"><i id="progress"></i></div>
<script>
(()=>{
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d');
const $=s=>document.querySelector(s),ui={goals:$('#goals'),shots:$('#shots'),best:$('#best'),title:$('#title'),sub:$('#sub'),eyebrow:$('#eyebrow'),kick:$('#kick'),toast:$('#toast'),progress:$('#progress')};
let w=0,h=0,dpr=1,ball={x:0,y:0},state='ready',pointer=null,shot=null,goals=0,shots=0,streak=0,best=+(localStorage.getItem('curveBest')||0),toastTimer=0;
ui.best.textContent=best;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),randSeed=(n)=>{let x=Math.sin(n*127.1+311.7)*43758.5453;return x-Math.floor(x)};
function resize(){dpr=Math.min(devicePixelRatio||1,2);w=innerWidth;h=innerHeight;canvas.width=Math.round(w*dpr);canvas.height=Math.round(h*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);ball={x:w*.5,y:h*.815}}
function path(points,fill,stroke,lw=1){ctx.beginPath();ctx.moveTo(points[0][0],points[0][1]);for(let i=1;i<points.length;i++)ctx.lineTo(points[i][0],points[i][1]);ctx.closePath();if(fill){ctx.fillStyle=fill;ctx.fill()}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=lw;ctx.stroke()}}
function line(x1,y1,x2,y2,color,width=1){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function drawCrowd(){let top=h*.075,bottom=h*.365;let stand=ctx.createLinearGradient(0,top,0,bottom);stand.addColorStop(0,'#1c3732');stand.addColorStop(.85,'#273e34');stand.addColorStop(1,'#a8a47f');ctx.fillStyle=stand;ctx.fillRect(0,top,w,bottom-top);ctx.save();ctx.beginPath();ctx.rect(0,top,w,bottom-top);ctx.clip();for(let row=0;row<11;row++){let yy=top+row*(bottom-top)/10;for(let i=0;i<Math.ceil(w/8);i++){let xx=i*8+(row%2)*4;let c=randSeed(i*21+row*79);ctx.fillStyle=['#a2b9a2','#f1be79','#4f7f70','#c65d48','#d9e3ca','#687d9b'][Math.floor(c*6)];ctx.globalAlpha=.18+c*.25;ctx.beginPath();ctx.ellipse(xx,yy+randSeed(i+row*18)*3,1.5+randSeed(i*7+row)*1.3,2.1,0,0,Math.PI*2);ctx.fill()}}ctx.globalAlpha=1;ctx.restore();let fascia=ctx.createLinearGradient(0,bottom-18,0,bottom+5);fascia.addColorStop(0,'#314e42');fascia.addColorStop(1,'#73866a');ctx.fillStyle=fascia;ctx.fillRect(0,bottom-13,w,19)}
function drawField(){let top=h*.36;let g=ctx.createLinearGradient(0,top,0,h);g.addColorStop(0,'#376b4a');g.addColorStop(.5,'#287044');g.addColorStop(1,'#174c34');path([[0,top],[w,top],[w,h],[0,h]],g);for(let i=0;i<6;i++){let y=top+(h-top)*i/6,yn=top+(h-top)*(i+1)/6;let inset=(y-top)*.09;path([[inset,y],[w-inset,y],[w-(yn-top)*.09,yn],[(yn-top)*.09,yn]],i%2?'rgba(152,206,113,.045)':'rgba(4,38,28,.045)')}
ctx.strokeStyle='rgba(232,239,201,.34)';ctx.lineWidth=Math.max(1,w*.002);ctx.beginPath();ctx.moveTo(w*.055,top+8);ctx.lineTo(w*.17,h);ctx.moveTo(w*.945,top+8);ctx.lineTo(w*.83,h);ctx.stroke();ctx.beginPath();ctx.ellipse(w*.5,h*.45,w*.22,h*.075,0,0,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.moveTo(w*.25,h*.43);ctx.lineTo(w*.75,h*.43);ctx.lineTo(w*.79,h*.59);ctx.lineTo(w*.21,h*.59);ctx.closePath();ctx.stroke();ctx.beginPath();ctx.ellipse(w*.5,h*.805,3,3,0,0,Math.PI*2);ctx.fillStyle='rgba(255,255,255,.5)';ctx.fill()}
function drawGoal(){let x1=w*.304,x2=w*.696,y1=h*.205,y2=h*.423;ctx.save();ctx.fillStyle='rgba(194,220,192,.1)';ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y1);ctx.lineTo(x2,y2);ctx.lineTo(x1,y2);ctx.closePath();ctx.fill();ctx.strokeStyle='rgba(229,239,214,.28)';ctx.lineWidth=1;for(let i=0;i<=12;i++){let x=x1+(x2-x1)*i/12;line(x,y1,x,y2,'rgba(230,239,222,.22)',.8)}for(let i=0;i<=7;i++){let y=y1+(y2-y1)*i/7;line(x1,y,x2,y,'rgba(230,239,222,.23)',.8)}ctx.restore();ctx.save();ctx.shadowColor='#d8e6d1';ctx.shadowBlur=9;line(x1,y1,x2,y1,'#f1f3df',Math.max(4,w*.012));line(x1,y1,x1,y2,'#f5f4e4',Math.max(4,w*.012));line(x2,y1,x2,y2,'#f5f4e4',Math.max(4,w*.012));ctx.restore();line(x1+5,y2,x2-5,y2,'#e2e8d4',2)}
function player(x,y,s,kind='blue'){let kit=kind==='keeper'?'#d8ff65':'#c6e8ed',dark=kind==='keeper'?'#82af31':'#608c9d',skin='#c68b67';ctx.save();ctx.translate(x,y);ctx.scale(s,s);ctx.fillStyle='rgba(7,22,16,.3)';ctx.beginPath();ctx.ellipse(0,2,13,4,0,0,Math.PI*2);ctx.fill();ctx.lineCap='round';line(-4,-10,-6,0,'#253840',4);line(4,-10,6,0,'#253840',4);line(-6,0,-10,1,'#101c20',4);line(6,0,11,1,'#101c20',4);line(-7,-27,-12,-15,skin,4);line(7,-27,12,-16,skin,4);ctx.fillStyle=kit;ctx.beginPath();ctx.moveTo(-8,-34);ctx.lineTo(8,-34);ctx.lineTo(9,-15);ctx.lineTo(-9,-15);ctx.closePath();ctx.fill();ctx.fillStyle=dark;ctx.fillRect(-2,-32,4,11);ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-40,6.1,0,Math.PI*2);ctx.fill();ctx.fillStyle='#192824';ctx.beginPath();ctx.arc(0,-43,6,Math.PI,0);ctx.fill();ctx.restore()}
function drawPlayers(){player(w*.5,h*.389,Math.min(w/420,.92),'keeper');player(w*.413,h*.545,Math.min(w/390,.92));player(w*.5,h*.555,Math.min(w/390,.92));player(w*.587,h*.545,Math.min(w/390,.92))}
function drawBall(x,y,r,spin=0){ctx.save();ctx.translate(x,y);ctx.rotate(spin);ctx.fillStyle='rgba(4,18,12,.36)';ctx.beginPath();ctx.ellipse(0,r*.78,r*1.25,r*.35,0,0,Math.PI*2);ctx.fill();let gr=ctx.createRadialGradient(-r*.34,-r*.45,r*.05,0,0,r);gr.addColorStop(0,'#fff');gr.addColorStop(.68,'#e5e9dd');gr.addColorStop(1,'#89978d');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.save();ctx.beginPath();ctx.arc(0,0,r*.88,0,Math.PI*2);ctx.clip();ctx.fillStyle='#1b2725';function pent(cx,cy,sz,rot=0){ctx.beginPath();for(let i=0;i<5;i++){let a=rot+i*Math.PI*2/5-Math.PI/2,px=cx+Math.cos(a)*sz,py=cy+Math.sin(a)*sz;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();ctx.fill()}pent(0,0,r*.32,.2);pent(-r*.62,-r*.15,r*.2,.2);pent(r*.6,-r*.36,r*.2,0);pent(r*.42,r*.55,r*.18,.3);pent(-r*.5,r*.58,r*.18,0);ctx.restore();ctx.restore()}
function drawAtmosphere(){let glow=ctx.createRadialGradient(w*.5,h*.37,0,w*.5,h*.37,w*.64);glow.addColorStop(0,'rgba(200,255,131,.08)');glow.addColorStop(1,'rgba(200,255,131,0)');ctx.fillStyle=glow;ctx.fillRect(0,0,w,h);for(let i=0;i<4;i++){let x=(i+.5)*w/4;ctx.fillStyle='rgba(228,247,205,.27)';ctx.beginPath();ctx.ellipse(x,h*.095,Math.max(20,w*.035),3,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(234,247,215,.12)';ctx.beginPath();ctx.ellipse(x,h*.12,Math.max(45,w*.065),11,0,0,Math.PI*2);ctx.fill()}}
function groundBall(){ctx.fillStyle='rgba(5,23,14,.32)';ctx.beginPath();ctx.ellipse(ball.x,ball.y+19,27,9,0,0,Math.PI*2);ctx.fill();drawBall(ball.x,ball.y,Math.min(w*.058,25))}
function drawGesture(){if(!pointer)return;let pts=pointer.points;if(pts.length<2)return;ctx.save();ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='#b8ff65';ctx.shadowBlur=15;ctx.strokeStyle='rgba(190,255,111,.85)';ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(pts[0].x,pts[0].y);for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i].x,pts[i].y);ctx.stroke();let a=pts[pts.length-1],b=pts[pts.length-2],ang=Math.atan2(a.y-b.y,a.x-b.x);ctx.fillStyle='#d5ffa4';ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(a.x-11*Math.cos(ang-.5),a.y-11*Math.sin(ang-.5));ctx.lineTo(a.x-11*Math.cos(ang+.5),a.y-11*Math.sin(ang+.5));ctx.fill();ctx.restore()}
function shotPoint(t){let p=clamp(t,0,1),ease=1-Math.pow(1-p,1.35),s=shot;return{x:s.sx+(s.ex-s.sx)*ease+Math.sin(p*Math.PI)*s.curl*w*.055,y:s.sy+(s.ey-s.sy)*ease-Math.sin(p*Math.PI)*h*(.065+s.power*.035),r:(Math.min(w*.058,25))*(1-ease*.76),spin:s.spin+p*7}}
function drawShot(){if(!shot)return;let p=clamp((performance.now()-shot.started)/shot.duration,0,1),here=shotPoint(p);ctx.save();ctx.globalAlpha=.6*(1-p*.45);ctx.strokeStyle='#caff8c';ctx.lineWidth=2;ctx.shadowColor='#b8ff65';ctx.shadowBlur=12;ctx.beginPath();for(let i=0;i<16;i++){let q=shotPoint(Math.max(0,p-i*.012));if(!i)ctx.moveTo(q.x,q.y);else ctx.lineTo(q.x,q.y)}ctx.stroke();ctx.restore();drawBall(here.x,here.y,Math.max(5,here.r),here.spin);ui.progress.style.width=`${Math.round(p*100)}%`;if(p>=1)finishShot()}
function draw(){if(!w||!h)return;ctx.clearRect(0,0,w,h);let sky=ctx.createLinearGradient(0,0,0,h*.4);sky.addColorStop(0,'#142d2a');sky.addColorStop(1,'#36534a');ctx.fillStyle=sky;ctx.fillRect(0,0,w,h*.4);drawAtmosphere();drawCrowd();drawField();drawGoal();drawPlayers();if(state==='flying')drawShot();else if(state!=='dead')groundBall();drawGesture();requestAnimationFrame(draw)}
function kickSound(power){try{let ac=new(window.AudioContext||window.webkitAudioContext)(),o=ac.createOscillator(),g=ac.createGain();o.type='triangle';o.frequency.setValueAtTime(115+power*40,ac.currentTime);o.frequency.exponentialRampToValueAtTime(42,ac.currentTime+.12);g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+.14);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+.15);setTimeout(()=>ac.close(),300)}catch(e){}}
function startShot(points,elapsed){if(state!=='ready'||points.length<2)return;let a=points[0],z=points[points.length-1],dx=z.x-a.x,dy=z.y-a.y,len=Math.hypot(dx,dy);if(dy>-50||len<70)return;let max=0,sign=0;for(let p of points){let d=(dx*(p.y-a.y)-dy*(p.x-a.x))/(len||1);if(Math.abs(d)>max){max=Math.abs(d);sign=Math.sign(d)}}let curl=clamp(max/(w*.085),0,1)*sign,speed=len/Math.max(100,elapsed),power=clamp(.32+speed*.43,.34,1),ex=clamp(w*.5+dx*.74+curl*w*.045,w*.2,w*.8);shot={sx:ball.x,sy:ball.y,ex,ey:h*.35,curl,power,spin:curl*.2,started:performance.now(),duration:clamp(1150-power*330,680,1030)};state='flying';shots++;ui.shots.textContent=shots;ui.kick.classList.add('hidden');ui.progress.style.width='0%';kickSound(power)}
function message(kind,title,detail){ui.toast.className=`toast show ${kind}`;ui.toast.querySelector('strong').textContent=title;ui.toast.querySelector('span').textContent=detail;clearTimeout(toastTimer);toastTimer=setTimeout(()=>ui.toast.classList.remove('show'),1250)}
function finishShot(){if(state!=='flying')return;let x=shot.ex,inside=x>w*.315&&x<w*.685,keeper=x>w*.455&&x<w*.545,wall=(x>w*.393&&x<w*.433)||(x>w*.478&&x<w*.522)||(x>w*.567&&x<w*.607),saved=inside&&(keeper||wall);if(inside&&!saved){goals++;streak++;ui.goals.textContent=goals;if(goals>best){best=goals;localStorage.setItem('curveBest',best);ui.best.textContent=best}message('goal','GOAL!','BEAUTIFULLY BENT')}else if(saved){streak=0;message('saved','DENIED','TRY A CORNER')}else{streak=0;message('saved','JUST WIDE','A LITTLE MORE AIM')}state='dead';shot=null;ui.eyebrow.textContent=goals?'KEEP IT GOING':'NICE TRY';ui.title.innerHTML=goals?`${goals} ${goals===1?'goal':'goals'} on<br>the board.`:'Find the<br>far corner.';ui.sub.innerHTML='<span class="swipe-icon">↗</span>Swipe again to take another kick.';ui.kick.classList.remove('hidden');setTimeout(()=>{if(state==='dead'){state='ready';ui.progress.style.width='0%'}},900)}
canvas.addEventListener('pointerdown',e=>{if(state!=='ready'||e.clientY<h*.57)return;canvas.setPointerCapture(e.pointerId);pointer={points:[{x:e.clientX,y:e.clientY}],time:performance.now()}});
canvas.addEventListener('pointermove',e=>{if(!pointer)return;let lastp=pointer.points[pointer.points.length-1];if(Math.hypot(e.clientX-lastp.x,e.clientY-lastp.y)>2)pointer.points.push({x:e.clientX,y:e.clientY,t:performance.now()});if(pointer.points.length>100)pointer.points.shift()});
canvas.addEventListener('pointerup',e=>{if(!pointer)return;pointer.points.push({x:e.clientX,y:e.clientY,t:performance.now()});let elapsed=performance.now()-pointer.time,pts=pointer.points;pointer=null;startShot(pts,elapsed)});canvas.addEventListener('pointercancel',()=>pointer=null);
$('#reset').addEventListener('click',()=>{goals=shots=streak=0;state='ready';shot=null;pointer=null;ui.goals.textContent=ui.shots.textContent='0';ui.title.innerHTML='Bend it like<br>you mean it.';ui.eyebrow.textContent='Your moment';ui.sub.innerHTML='<span class="swipe-icon">↗</span>Swipe the ball. Faster swipe = more power.<br>Draw a curve to add curl.';ui.progress.style.width='0%';ui.toast.classList.remove('show');ui.kick.classList.remove('hidden')});
window.addEventListener('resize',resize);resize();requestAnimationFrame(draw);
})();
</script></body></html>
